name: Deploy GitHub Pages

on:
  push:
    branches: [store-staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          test -f store-source/index.html
          test -f store-source/styles.css
          test -f store-source/assets/hero-race.jpg
          test -f store-source/assets/store.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: store-source

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
